name: Validate QuestForge

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  validate-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialize pack
        shell: bash
        run: |
          packwiz init --reinit -y --name QuestForge --author Maximka10 --version 0.1.0 --mc-version 1.20.1 --modloader forge --forge-version 47.4.23

      - name: Resolve and download mods
        shell: bash
        run: |
          while IFS='|' read -r source slug; do
            [[ -z "$source" || "$source" == \#* ]] && continue
            case "$source" in
              mr) packwiz mr install "$slug" -y ;;
              *) echo "Unsupported source: $source"; exit 1 ;;
            esac
          done < <(grep -v '^\s*#' scripts/mods.txt | grep -v '^\s*$')

      - name: Generate Quest Book
        run: python3 scripts/generate_quests.py

      - name: Refresh index
        run: packwiz refresh

      - name: Export Modrinth pack
        run: packwiz modrinth export -o QuestForge-ci.mrpack

      - name: Install Forge client profile
        shell: bash
        run: |
          mkdir -p .forge-installer .minecraft
          curl -fL 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' -o .forge-installer/forge-installer.jar
          java -jar .forge-installer/forge-installer.jar --installClient --targetDir "$GITHUB_WORKSPACE/.minecraft"

      - name: Assemble drop-in .minecraft package
        shell: bash
        run: |
          rm -rf drop-in
          mkdir -p drop-in/versions drop-in/mods drop-in/config drop-in/defaultconfigs drop-in/kubejs drop-in/resourcepacks drop-in/shaderpacks
          cp -a mods/. drop-in/mods/
          cp -a config/. drop-in/config/ 2>/dev/null || true
          cp -a defaultconfigs/. drop-in/defaultconfigs/ 2>/dev/null || true
          cp -a kubejs/. drop-in/kubejs/ 2>/dev/null || true
          cp -a resourcepacks/. drop-in/resourcepacks/ 2>/dev/null || true
          cp -a shaderpacks/. drop-in/shaderpacks/ 2>/dev/null || true
          cp -a .minecraft/versions/. drop-in/versions/
          cat > drop-in/INSTALL.txt <<'EOF'
QuestForge 0.1.0 - Minecraft 1.20.1 Forge 47.4.23

Copy the contents of this folder into your .minecraft folder.
The versions/ folder goes to .minecraft/versions/.
The launcher may still download missing vanilla libraries/assets on first launch.
Recommended RAM: 8-10 GB allocated to Minecraft.
Do not copy saves from other modpacks into this instance before the first clean boot.
EOF

      - name: Package drop-in archive
        run: zip -r QuestForge-drop-in.zip drop-in

      - name: Validate Forge server
        shell: bash
        run: |
          rm -rf server-test
          mkdir server-test
          curl -fL 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' -o server-test/forge-installer.jar
          java -jar server-test/forge-installer.jar --installServer server-test
          cp -a mods/. server-test/mods/
          cp -a config/. server-test/config/ 2>/dev/null || true
          cp -a defaultconfigs/. server-test/defaultconfigs/ 2>/dev/null || true
          printf 'eula=true\n' > server-test/eula.txt
          cd server-test
          timeout 180s bash -c 'java @user_jvm_args.txt @libraries/net/minecraftforge/forge/1.20.1-47.4.23/unix_args.txt nogui' > server.log 2>&1 || true
          tail -n 120 server.log
          ! grep -Eq 'ERROR|FATAL|Exception in server tick loop|ModLoadingException' server.log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuestForge-0.1.0-build
          path: |
            QuestForge-ci.mrpack
            QuestForge-drop-in.zip
          if-no-files-found: error
          retention-days: 7
