name: QuestForge Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packwiz from latest official build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tools
          RUN_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/packwiz/packwiz/actions/runs?status=success&per_page=20')
          RUN_ID=$(printf '%s' "$RUN_JSON" | jq -r '.workflow_runs[] | select(.name == "Go") | .id' | head -n1)
          test -n "$RUN_ID" && test "$RUN_ID" != "null"
          ART_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/packwiz/packwiz/actions/runs/${RUN_ID}/artifacts")
          ART_ID=$(printf '%s' "$ART_JSON" | jq -r '.artifacts[] | select(.name | test("Linux 64-bit")) | .id' | head -n1)
          test -n "$ART_ID" && test "$ART_ID" != "null"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/packwiz/packwiz/actions/artifacts/${ART_ID}/zip" -o .tools/packwiz.zip
          unzip -oq .tools/packwiz.zip -d .tools/extracted
          BIN=$(find .tools/extracted -type f -name 'packwiz' | head -n1)
          test -n "$BIN"
          chmod +x "$BIN"
          cp "$BIN" .tools/packwiz
          .tools/packwiz --version
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"

      - name: Init pack
        run: packwiz init --reinit -y --name QuestForge --author Maximka10 --version 0.1.0 --mc-version 1.20.1 --modloader forge --forge-version 47.4.23

      - name: Install mods
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r source slug; do
            [[ -z "$source" || "$source" == \#* ]] && continue
            [[ "$source" == "mr" ]] || continue
            echo "Installing $slug"
            packwiz mr install "$slug" -y
          done < scripts/mods.txt

      - name: Generate quests
        run: python3 scripts/generate_quests.py

      - name: Refresh
        run: packwiz refresh

      - name: Export Modrinth pack
        run: packwiz modrinth export -o QuestForge.mrpack

      - name: Install Forge 47.4.23 client profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p forge-client .minecraft
          curl -fsSL 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-client/installer.jar
          echo 'ed31ce02ac69176f34353235cb2508d5a0f1e0881  forge-client/installer.jar' | sha1sum -c -
          java -Djava.awt.headless=true -jar forge-client/installer.jar --installClient --targetDir "$GITHUB_WORKSPACE/.minecraft"
          test -d .minecraft/versions/1.20.1-forge-47.4.23

      - name: Assemble ready .minecraft tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf drop-in
          mkdir -p drop-in/mods drop-in/config drop-in/defaultconfigs drop-in/kubejs drop-in/resourcepacks drop-in/shaderpacks drop-in/versions
          cp -a mods/. drop-in/mods/
          cp -a config/. drop-in/config/ 2>/dev/null || true
          cp -a defaultconfigs/. drop-in/defaultconfigs/ 2>/dev/null || true
          cp -a kubejs/. drop-in/kubejs/ 2>/dev/null || true
          cp -a resourcepacks/. drop-in/resourcepacks/ 2>/dev/null || true
          cp -a shaderpacks/. drop-in/shaderpacks/ 2>/dev/null || true
          cp -a .minecraft/versions/. drop-in/versions/
          cat > drop-in/INSTALL.txt <<'EOF'
QuestForge 0.1.0
Minecraft 1.20.1
Forge 47.4.23
Java 17 x64

Copy everything inside this folder into .minecraft.
The version folder is already included under versions/.
The official launcher can download missing vanilla libraries/assets on first launch.
Recommended RAM: 8-10 GB.
For a clean first run, create a new instance/world and do not reuse another pack's configs.
EOF
          test -f drop-in/versions/1.20.1-forge-47.4.23/1.20.1-forge-47.4.23.json

      - name: Package ready files
        run: zip -r QuestForge-1.20.1-Forge-47.4.23-ready.zip drop-in

      - name: Upload ready artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuestForge-1.20.1-Forge-47.4.23-ready
          path: |
            QuestForge.mrpack
            QuestForge-1.20.1-Forge-47.4.23-ready.zip
          if-no-files-found: error
          retention-days: 7
