name: QuestForge Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build QuestForge
        run: python3 scripts/build_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuestForge-1.20.1-Forge-47.4.23-ready
          path: |
            QuestForge.mrpack
            QuestForge-1.20.1-Forge-47.4.23-ready.zip
          if-no-files-found: error
          retention-days: 14
