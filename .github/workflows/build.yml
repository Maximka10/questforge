name: "QuestForge Build"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official packwiz binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tools
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/packwiz/packwiz/actions/artifacts/8109649028/zip' \
            -o .tools/packwiz.zip
          unzip -oq .tools/packwiz.zip -d .tools/extracted
          BIN=$(find .tools/extracted -type f -name 'packwiz' | head -n 1)
          test -n "$BIN"
          cp "$BIN" .tools/packwiz
          chmod +x .tools/packwiz
          .tools/packwiz --help >/dev/null
          echo "$GITHUB_WORKSPACE/.tools" >> "$GITHUB_PATH"
      - name: Build QuestForge
        run: python3 scripts/build_ci.py
      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: QuestForge-1.20.1-Forge-47.4.23-ready
          path: |
            QuestForge.mrpack
            QuestForge-1.20.1-Forge-47.4.23-ready.zip
          if-no-files-found: error
          retention-days: 14
