name: "QuestForge Build"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install packwiz
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          packwiz --help >/dev/null
      - name: Build QuestForge
        run: python3 scripts/build_ci.py
      - name: Upload ready package
        uses: actions/upload-artifact@v4
        with:
          name: QuestForge-1.20.1-Forge-47.4.23-ready
          path: |
            QuestForge.mrpack
            QuestForge-1.20.1-Forge-47.4.23-ready.zip
          if-no-files-found: error
          retention-days: 14
